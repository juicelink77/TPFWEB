    <style>
body {
            background-color: #1a1a1a;

            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;

        }

        canvas.emscripten {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 68%; /* Laisse plus d'espace (32%) en haut pour le titre */
            width: auto;
            aspect-ratio: 4 / 3;
            max-width: 100%;
            border: 0px none;
            background-color: black;
            display: block;
            image-rendering: pixelated;

            box-shadow: 0px -5px 30px rgba(0,0,0,0.8);

        header {

        }

        #rom-status {

        .game-library {

        .game-card {

        .game-img {

<body>
    <div id="status" style="margin-top: 10px; font-size: 14px; color: #aaa;"></div>
    <progress value="0" max="100" id="progress" hidden=1></progress>

    <div id="share-container" style="display: none; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
        <span>🔗 Share this game:</span>
        <span id="share-url"></span>
        <button class="copy-btn" onclick="copyShareUrl()">📋 Copy</button>
    </div>

    <div style="position: relative; width: 100%; max-width: 1200px; margin: 0 auto;">
        <img id="game-bg" src="images/cover.png" alt="" style="width: 100%; height: auto; display: block;">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <div style="text-align: center; margin-top: 15px;">
        <a id="game-link" href="#" target="_blank" style="color: #4caf50; font-size: 18px; font-weight: bold; text-decoration: underline;"></a>
    </div>

    <details style="width: 95%; margin-top: 10px;">
        <summary style="cursor: pointer; color: #888; font-size: 14px; margin-bottom: 5px;">💻 Console Output (click to
            expand)</summary>
        <textarea id="output" readonly></textarea>
    </details>



    <script type='text/javascript'>
        // Initialization from config.js
        document.title = CONFIG.gameTitle;
        document.getElementById('game-link').href = CONFIG.gameUrl;
        document.getElementById('game-link').textContent = CONFIG.linkText;
        document.getElementById('game-link').style.color = CONFIG.linkColor;
        document.getElementById('game-bg').alt = CONFIG.gameTitle;

        var gameName = CONFIG.romName; // Default ROM to load
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var outputElement = document.getElementById('output');


        function log(msg) {
            outputElement.value += msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
        }

        // IndexedDB for storing ROM data
        var DB_NAME = 'MameWasmDB';
        var DB_VERSION = 1;
        var STORE_NAME = 'roms';

        function openDB() {
            return new Promise(function (resolve, reject) {
                var req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = function (e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = function (e) { resolve(e.target.result); };
                req.onerror = function (e) { reject(e.target.error); };
            });
        }

        function storeData(romName, romData, cassName, cassData) {
            return openDB().then(function (db) {
                return new Promise(function (resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readwrite');
                    var store = tx.objectStore(STORE_NAME);
                    if (romData) {
                        store.put(romData, 'romData');
                        store.put(romName, 'romName');
                    }
                    if (cassData !== undefined) { // can be null to clear
                        store.put(cassData, 'cassData');
                        store.put(cassName, 'cassName');
                    }
                    tx.oncomplete = function () { resolve(); };
                    tx.onerror = function (e) { reject(e.target.error); };
                });
            });
        }

        // Define Module BEFORE mametiny.js loads
        window.Module = {
            noInitialRun: false,
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    outputElement.value += text + "\n";
                    outputElement.scrollTop = outputElement.scrollHeight;
                };
            })(),
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                outputElement.value += "[ERR] " + text + "\n";
                outputElement.scrollTop = outputElement.scrollHeight;
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. Reload the page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        // Use a synchronous ROM load via IndexedDB sync API
        // Since IndexedDB is async, we use noInitialRun + run() approach
        // But since run() may not be exported, we use preRun with sync XHR fallback
        // System is fixed to NeoGeo
        var driver = 'neogeo';
        Module.arguments = [driver, gameName, '-rompath', '/roms', '-hashpath', '/hash', '-cfg_directory', '/cfg', '-joystick', '-video', 'accel', '-resolution', '640x480', '-keepaspect', '-window', '-audio_latency', '1'];

        // Check for game to load (URL parameter has priority, then sessionStorage)
        var urlParams = new URLSearchParams(window.location.search);
        var gameToLoad = urlParams.get('load') || sessionStorage.getItem('mame_load_internal');

        loadStoredData().then(function (data) {
            if (gameToLoad) {
                // Determine the correct filename (handle 'local' case)
                var fileName = (gameToLoad === 'local') ? data.cassName : gameToLoad;

                if (fileName) {
                    var isState = fileName.endsWith('.sta');

                    if (isState) {
                        var stateName = fileName.replace('.sta', '');
                        Module.arguments.push('-state', stateName);
                        log('💿 Loading savestate: ' + fileName);
                    } else {
                        Module.arguments.push('-cass', '/roms/' + fileName);
                        Module.arguments.push('-autoboot_delay', '1');
                        Module.arguments.push('-autoboot_command', '1CLOAD\\n');
                        log('💿 Loading cassette: ' + fileName);
                    }

                    // Auto-scroll to emulator
                    setTimeout(function () {
                        document.getElementById('canvas').scrollIntoView({ behavior: 'smooth' });
                    }, 500);

                    // Show share link
                    var shareUrl = window.location.origin + window.location.pathname + '?load=' + encodeURIComponent(fileName);
                    document.getElementById('share-container').style.display = 'flex';
                    document.getElementById('share-url').textContent = shareUrl;
                }

                // Clear internal flag so refresh starts clean
                sessionStorage.removeItem('mame_load_internal');
            } else {
                log('⌨️ Standalone mode (no cassette auto-loaded)');
            }
        });

        Module.preRun.push(function () {
            Module.addRunDependency('mame-init');

            // 1. Ensure directory exists
            try { FS.mkdir('/roms'); } catch (ex) { }
            try { FS.mkdir('/sta'); FS.mkdir('/sta/neogeo'); } catch (ex) { }
            try { FS.mkdir('/hash'); } catch (ex) { }
            try { FS.mkdir('/cfg'); } catch (ex) { }

            // 2. Fetch NeoGeo ROM from server
            var romPromise = fetch('roms/neogeo.zip')
                .then(res => {
                    if (!res.ok) throw new Error('NeoGeo ROM missing');
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    FS.writeFile('/roms/neogeo.zip', new Uint8Array(buffer));
                    log('✅ System ROM loaded: neogeo.zip');
                });

            // 2.1 Fetch NeoGeo Hash XML
            var hashPromise = fetch('hash/NeoGeo.xml')
                .then(res => {
                    if (!res.ok) throw new Error('NeoGeo XML missing');
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    FS.writeFile('/hash/neogeo.xml', new Uint8Array(buffer));
                    log('✅ Hash file loaded: neogeo.xml');
                });

            // 2.2 Fetch Game ROM
            var gamePromise = fetch('roms/' + gameName + '.zip')
                .then(res => {
                    if (!res.ok) throw new Error(gameName + '.zip missing');
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    FS.writeFile('/roms/' + gameName + '.zip', new Uint8Array(buffer));
                    log('✅ Game ROM loaded: ' + gameName + '.zip');
                });

            // 2.3 Fetch Default CFG (Input bindings)
            var cfgPromise = fetch('cfg/default.txt')
                .then(res => {
                    if (!res.ok) return null;
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    if (buffer) {
                        FS.writeFile('/cfg/default.cfg', new Uint8Array(buffer));
                        log('✅ Input config loaded: default.cfg');
                    }
                });

            // 3. Load Cassette/State from IndexedDB if present
            var cassPromise = loadStoredData().then(function (res) {
                if (res.cassName && res.cassData) {
                    var data = new Uint8Array(res.cassData);
                    if (res.cassName.endsWith('.sta')) {
                        FS.writeFile('/sta/neogeo/' + res.cassName, data);
                        log('✅ Savestate mounted: ' + res.cassName);
                    } else {
                        FS.writeFile('/roms/' + res.cassName, data);
                        log('✅ Cassette mounted: ' + res.cassName);
                    }
                }
            });

            Promise.all([romPromise, hashPromise, gamePromise, cassPromise, cfgPromise]).then(() => {
                Module.removeRunDependency('mame-init');
            }).catch(err => {
                log('❌ Error during init: ' + err);
                Module.removeRunDependency('mame-init');
            });
        });

        window.onerror = function (event, source, lineno, colno, error) {
            Module.setStatus('Exception thrown, see JavaScript console');
            var msg = "window.onerror: " + event + "\n";
            if (source) msg += "Source: " + source + ":" + lineno + ":" + colno + "\n";
            if (error && error.stack) msg += "Stack:\n" + error.stack + "\n";
            outputElement.value += "\n[FATAL ERROR]\n" + msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
        };

        function loadStoredData() {
            return openDB().then(function (db) {
                return new Promise(function (resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readonly');
                    var store = tx.objectStore(STORE_NAME);
                    var reqs = {
                        romName: store.get('romName'),
                        romData: store.get('romData'),
                        cassName: store.get('cassName'),
                        cassData: store.get('cassData')
                    };

                    tx.oncomplete = function () {
                        resolve({
                            romName: reqs.romName.result,
                            romData: reqs.romData.result,
                            cassName: reqs.cassName.result,
                            cassData: reqs.cassData.result
                        });
                    };
                    tx.onerror = function (e) { reject(e.target.error); };
                });
            });
        }




        function copyShareUrl() {
            var url = document.getElementById('share-url').textContent;
            var btn = document.querySelector('.copy-btn');

            navigator.clipboard.writeText(url).then(function () {
                var oldText = btn.innerHTML;
                btn.innerHTML = '✅ Copied!';
                btn.style.borderColor = '#4caf50';
                btn.style.color = '#4caf50';

                setTimeout(function () {
                    btn.innerHTML = oldText;
                    btn.style.borderColor = '#555';
                    btn.style.color = '#ccc';
                }, 2000);
            }).catch(function (err) {
                console.error('Could not copy text: ', err);
            });
        }




    </script>
    <script async type="text/javascript" src="mame.js"></script>
<script>
/* Pont manette -> clavier pour MAME WASM (Xbox 360, mapping standard). */
(function () {
  const MAP = {
    up:{code:'ArrowUp',kc:38}, down:{code:'ArrowDown',kc:40},
    left:{code:'ArrowLeft',kc:37}, right:{code:'ArrowRight',kc:39},
    a:{code:'KeyC',kc:67}, b:{code:'KeyV',kc:86},        /* boutons 1/2 = C / V (cfg/default.txt) */
    x:{code:'Space',kc:32}, y:{code:'ShiftLeft',kc:16},  /* boutons 3/4 = Espace / Maj */
    start:{code:'Digit1',kc:49}, back:{code:'Digit5',kc:53}, menu:{code:'Tab',kc:9},
  };
  const st = {};
  const targets = [window, document, document.getElementById('canvas')].filter(Boolean);
  function send(type, m) {
    for (const t of targets) {
      const ev = new KeyboardEvent(type, { code:m.code, key:m.code, bubbles:false, cancelable:true });
      try { Object.defineProperty(ev,'keyCode',{value:m.kc});
            Object.defineProperty(ev,'which',{value:m.kc}); } catch(e){}
      t.dispatchEvent(ev);
    }
  }
  function set(name, pressed) {
    const m = MAP[name]; if(!m) return;
    if (pressed && !st[name]) { st[name]=1; send('keydown',m); console.log('PAD press', name, '->', m.code); }
    else if (!pressed && st[name]) { st[name]=0; send('keyup',m); }
  }
  let announced=false;
  function poll() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp=null; for (const g of gps) if(g){gp=g;break;}
    if (gp) {
      if(!announced){announced=true; console.log('PAD connected:', gp.id, '| buttons', gp.buttons.length, '| axes', gp.axes.length);}
      const b=gp.buttons, ax=gp.axes, AX=0.5, P=i=>b[i]&&(b[i].pressed||b[i].value>0.5);
      set('up',P(12)||ax[1]<-AX); set('down',P(13)||ax[1]>AX);
      set('left',P(14)||ax[0]<-AX); set('right',P(15)||ax[0]>AX);
      set('a',P(0)); set('b',P(1)); set('x',P(2)); set('y',P(3));
      set('start',P(9)); set('back',P(8)); set('menu',P(4));
    }
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);
  console.log('== Gamepad bridge v2 actif ==');
})();
</script>
